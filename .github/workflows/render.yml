name: render
run-name: render ${{ inputs.slug }}
on:
  workflow_dispatch:
    inputs:
      slug: { required: true }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "jobs/${{ inputs.slug }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter
      - name: render
        working-directory: jobs/${{ inputs.slug }}
        run: npx --yes hyperframes@0.9.8 render -o "${{ inputs.slug }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.slug }}
          path: jobs/${{ inputs.slug }}/${{ inputs.slug }}.mp4
          retention-days: 3
